name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://oddstock:oddstock_local_only@localhost:55432/oddstock?schema=public
      KAFKA_BROKERS: localhost:29092
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          version: 11.19.0
          install: false
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oddstock/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Start services
        run: pnpm infra:up

      - name: Wait for services
        run: |
          ready=false
          for attempt in $(seq 1 90); do
            if docker compose -f infra/compose.yml exec -T postgres pg_isready -U oddstock -d oddstock >/dev/null 2>&1 && \
              docker compose -f infra/compose.yml exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list 2>/dev/null | grep -qx 'marketplace.orders'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f infra/compose.yml logs
            exit 1
          fi

      - name: Prepare database
        run: pnpm --filter @oddstock/api db:push

      - name: Integration tests
        run: |
          set -euo pipefail
          pnpm --filter @oddstock/api dev > /tmp/oddstock-api.log 2>&1 &
          api_pid=$!
          pnpm --filter @oddstock/api worker > /tmp/oddstock-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:4000/api/ready | grep -q '"ready":true'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/oddstock-api.log /tmp/oddstock-worker.log
            exit 1
          fi

          if ! pnpm test:integration; then
            cat /tmp/oddstock-api.log
            cat /tmp/oddstock-worker.log
            exit 1
          fi

      - name: Stop services
        if: always()
        run: pnpm infra:down
